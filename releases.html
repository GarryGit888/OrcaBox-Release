<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080d">
  <meta http-equiv="cache-control" content="no-cache">
  <meta http-equiv="pragma" content="no-cache">
  <title>OrcaBox 更新记录</title>
  <link rel="icon" type="image/png" href="assets/orcabox-icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --font: 'Geist', -apple-system, BlinkMacSystemFont, 'Noto Sans SC', 'Noto Sans JP', 'Noto Sans KR', sans-serif;
      --font-mono: 'Geist Mono', 'SF Mono', monospace;
      --bg: #08080d;
      --bg-raised: #101018;
      --bg-subtle: #14141e;
      --text: #e4e4e7;
      --text-2: #9898a4;
      --text-3: #666674;
      --border: #27272a;
      --border-subtle: #1c1c24;
      --accent: #3b82f6;
      --accent-dim: rgba(59, 130, 246, .10);
      --accent-soft: rgba(59, 130, 246, .16);
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow-md: 0 4px 16px rgba(0, 0, 0, .30);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html {
      overflow-x: hidden;
      background: var(--bg);
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: .9375rem;
      line-height: 1.6;
    }
    ::selection { background: var(--accent); color: #fff; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 56px;
      border-bottom: 1px solid var(--border-subtle);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
    }
    .nav-inner {
      max-width: 1280px;
      height: 100%;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--text);
      font-size: .9375rem;
      font-weight: 600;
      letter-spacing: -.02em;
    }
    .nav-brand img {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      object-fit: cover;
      box-shadow: 0 1px 5px rgba(0, 0, 0, .35);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 14px;
      color: var(--text-2);
      font-size: .8125rem;
      font-weight: 500;
      white-space: nowrap;
      transition: color .2s, border-color .2s, background-color .2s, transform .2s var(--ease);
    }
    .nav-link:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--text);
      transform: translateY(-1px);
    }
    .lang-switch { position: relative; }
    .lang-btn {
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-2);
      font-family: var(--font);
      font-size: .75rem;
      font-weight: 500;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
    }
    .lang-btn:hover { color: var(--text); border-color: var(--accent); }
    .lang-btn svg { width: 14px; height: 14px; transition: transform .2s; }
    .lang-btn.open svg { transform: rotate(180deg); }
    .lang-drop {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-raised);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: all .2s var(--ease);
      z-index: 30;
      min-width: 110px;
    }
    .lang-drop.show { opacity: 1; visibility: visible; transform: translateY(0); }
    .lang-option {
      display: block;
      width: 100%;
      padding: 8px 14px;
      border: none;
      background: transparent;
      color: var(--text-2);
      font-family: var(--font);
      font-size: .75rem;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      transition: all .1s;
    }
    .lang-option:hover { color: var(--text); background: var(--accent-dim); }
    .lang-option.active { color: var(--accent); font-weight: 600; }

    .container {
      width: min(100% - 64px, 1180px);
      margin: 0 auto;
    }
    .hero {
      padding: 72px 0 36px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      align-items: end;
      gap: 48px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      border: 1px solid rgba(59, 130, 246, .35);
      border-radius: 999px;
      padding: 5px 10px;
      background: rgba(59, 130, 246, .08);
      color: #b7d4ff;
      font-family: var(--font-mono);
      font-size: .6875rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #60a5fa;
      box-shadow: 0 0 12px rgba(96, 165, 250, .9);
      content: "";
    }
    h1 {
      max-width: 860px;
      margin: 0;
      color: var(--text);
      font-size: clamp(2.4rem, 6vw, 5.8rem);
      font-weight: 700;
      letter-spacing: -.05em;
      line-height: .98;
    }
    .hero p {
      max-width: 660px;
      margin: 20px 0 0;
      color: var(--text-2);
      font-size: 1.0625rem;
      line-height: 1.7;
      text-wrap: pretty;
    }
    .release-stat {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-raised);
      padding: 20px;
    }
    .release-stat strong {
      display: block;
      color: var(--text);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -.03em;
    }
    .release-stat span {
      display: block;
      margin-top: 3px;
      color: var(--text-3);
      font-size: .8125rem;
    }

    .workspace {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr);
      align-items: start;
      gap: 48px;
      padding: 36px 0 88px;
      min-width: 0;
    }
    .version-nav {
      position: sticky;
      top: 88px;
      min-width: 0;
    }
    .section-label {
      margin: 0 0 10px;
      color: var(--text-3);
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .version-list {
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .version-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      border-left: 2px solid transparent;
      padding: 8px 10px;
      color: var(--text-2);
      transition: background-color .2s, border-color .2s, color .2s;
    }
    .version-item:hover {
      background: var(--bg-raised);
      color: var(--text);
    }
    .version-item.is-current {
      border-left-color: var(--accent);
      background: var(--accent-dim);
      color: var(--text);
    }
    .version-item strong {
      font-size: .8125rem;
      font-weight: 600;
    }
    .version-item span {
      color: var(--text-3);
      font-family: var(--font-mono);
      font-size: .6875rem;
    }

    .content-column,
    .release-panel,
    .history-card,
    .history-card p { min-width: 0; }
    .release-panel {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-raised);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .release-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
      border-bottom: 1px solid var(--border-subtle);
      padding: 26px 28px 22px;
    }
    .release-head h2 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 650;
      letter-spacing: -.025em;
      line-height: 1.2;
    }
    .release-head p {
      margin: 6px 0 0;
      color: var(--text-3);
      font-size: .8125rem;
    }
    .release-date {
      color: var(--text-2);
      font-family: var(--font-mono);
      font-size: .75rem;
      white-space: nowrap;
    }
    .release-summary {
      margin: 0;
      padding: 22px 28px 0;
      color: var(--text-2);
      font-size: .9375rem;
      line-height: 1.75;
    }
    .change-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0 28px;
      padding: 24px 28px 28px;
    }
    .change-group {
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .change-group h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: var(--text);
      font-size: .8125rem;
      font-weight: 600;
    }
    .change-group h3::before {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
      content: "";
    }
    .change-group:nth-child(2) h3::before { background: #22c55e; }
    .change-group:nth-child(3) h3::before { background: #f59e0b; }
    .change-group ul {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .change-group li {
      position: relative;
      padding-left: 15px;
      color: var(--text-2);
      font-size: .875rem;
      line-height: 1.7;
    }
    .change-group li::before {
      position: absolute;
      left: 0;
      color: var(--text-3);
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: currentColor;
      top: .78em;
    }
    .release-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 1px solid var(--border-subtle);
      padding: 18px 28px;
      background: rgba(20, 20, 30, .52);
    }
    .action-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 14px;
      color: var(--text);
      font-size: .8125rem;
      font-weight: 500;
      white-space: nowrap;
      transition: background-color .2s, border-color .2s, color .2s, transform .2s var(--ease);
    }
    .action-link.is-primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .action-link:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--text);
      transform: translateY(-1px);
    }
    .action-link.is-primary:hover {
      background: #4b8df7;
      color: #fff;
    }

    .history {
      margin-top: 44px;
      border-top: 1px solid var(--border-subtle);
      padding-top: 26px;
    }
    .history-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 12px;
    }
    .history-heading h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    .history-heading span {
      color: var(--text-3);
      font-size: .75rem;
    }
    .history-list {
      display: grid;
      border-bottom: 1px solid var(--border-subtle);
    }
    .history-card {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) auto;
      align-items: center;
      gap: 20px;
      min-height: 76px;
      border-top: 1px solid var(--border-subtle);
      padding: 14px 4px;
    }
    .history-card h3 {
      margin: 0;
      color: var(--text);
      font-size: .875rem;
      font-weight: 600;
    }
    .history-card time {
      display: block;
      margin-top: 2px;
      color: var(--text-3);
      font-family: var(--font-mono);
      font-size: .6875rem;
    }
    .history-card p {
      margin: 0;
      color: var(--text-2);
      font-size: .8125rem;
      line-height: 1.65;
    }
    .history-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: end;
      gap: 8px;
    }
    .history-links a {
      color: #9ec5ff;
      font-size: .75rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .history-links a:hover { color: var(--text); }
    .empty {
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 18px;
      color: var(--text-2);
    }

    @media (max-width: 900px) {
      .container { width: min(100% - 40px, 1180px); }
      .hero-grid { grid-template-columns: 1fr; gap: 26px; }
      .release-stat { max-width: 320px; }
      .workspace { grid-template-columns: 1fr; gap: 28px; }
      .version-nav { position: static; }
      .version-list {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .version-item {
        flex: 0 0 auto;
        border-left: 0;
        border-bottom: 2px solid transparent;
      }
      .version-item.is-current { border-bottom-color: var(--accent); }
      .change-grid { grid-template-columns: 1fr; gap: 18px; }
      .history-card { grid-template-columns: 1fr; gap: 6px; }
      .history-links { justify-content: start; }
    }
    @media (max-width: 620px) {
      .nav-inner { padding: 0 16px; }
      .nav-link:first-child { display: none; }
      .container { width: min(100% - 24px, 1180px); }
      .hero { padding: 48px 0 28px; }
      h1 { font-size: 2.7rem; }
      .release-head { grid-template-columns: 1fr; gap: 8px; padding: 22px 20px 18px; }
      .release-summary { padding: 18px 20px 0; }
      .change-grid { padding: 22px 20px; }
      .release-actions {
        flex-direction: column;
        padding: 16px 20px;
      }
      .action-link { align-self: stretch; }
      .history-heading { display: block; }
      .history-heading span { display: block; margin-top: 3px; }
      .history-card p,
      .release-summary,
      .change-group li { overflow-wrap: anywhere; }
    }
  </style>
</head>

  <header class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">

      </a>
      <div class="nav-actions">

            <button class="lang-option" type="button" role="menuitem" data-lang="ja">🇯🇵 日本語</button>
            <button class="lang-option" type="button" role="menuitem" data-lang="ko">🇰🇷 한국어</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-grid">
        <div>
          <span class="eyebrow" id="eyebrow">Release Notes</span>
          <h1 id="hero-title">OrcaBox 更新记录</h1>
          <p id="hero-desc">查看每个版本的新增能力、体验优化、问题修复与公开下载信息。</p>
        </div>
        <div class="release-stat" aria-live="polite">
          <strong id="release-count">--</strong>
          <span id="stat-note">持续维护中</span>
        </div>
      </div>
    </section>

    <div class="container workspace">
      <aside class="version-nav" id="version-nav" aria-label="版本导航">
        <p class="section-label" id="section-label">历史版本</p>
        <nav id="version-list" class="version-list"></nav>
      </aside>

      <div class="content-column">
        <section id="latest"></section>
        <section id="history" class="history" aria-labelledby="history-title">
          <div class="history-heading">
            <h2 id="history-title">全部版本</h2>
            <span id="history-sort">按发布日期排序</span>
          </div>
          <div id="history-list" class="history-list"></div>
        </section>
      </div>
    </div>
  </main>

        heroTitle: 'OrcaBox 更新履歴',
        heroDesc: '各バージョンの新機能・改善・不具合修正と公開ダウンロード情報を確認できます。',
        navLatest: '最新バージョン',
        navHome: '公式サイトへ',
        versionNavLabel: 'バージョンナビゲーション',
        sectionLabel: 'バージョン履歴',
        statCount: (n) => `${n} 個のバージョン`,
        statNote: 'メンテナンス継続中',
        currentRelease: '現在の公開版',
        allVersions: 'すべてのバージョン',
        sortedByDate: 'リリース日順',
        groups: { features: '新機能', improvements: '改善', fixes: '修正' },
        emptyGroup: 'このカテゴリの更新はありません',
        emptyLatest: 'リリース記録はまだありません。',
        emptyHistory: '過去のバージョンはありません。',
        loadError: 'リリース記録を読み込めませんでした。',
        noDownloads: '公開ダウンロードリンクはまだありません。',
        actionLinks: {
          windowsInstaller: 'Windows x64 インストーラー',
          windowsPortable: 'Windows ポータブル版',
          cnbRelease: 'CNB ダウンロード',
          githubRelease: '予備ダウンロード',
          browserExtension: 'Chrome 拡張機能',
        },
        historyLinks: {
          windowsInstaller: 'インストーラー',
          windowsPortable: 'ポータブル版',
          cnbRelease: 'ダウンロード',
          githubRelease: '予備ダウンロード',
          browserExtension: '拡張機能',
        },
      },
      ko: {
        htmlLang: 'ko-KR',
        title: 'OrcaBox 업데이트 기록',
        eyebrow: '업데이트 노트',
        heroTitle: 'OrcaBox 업데이트 기록',
        heroDesc: '버전별 새 기능, 개선 사항, 버그 수정과 공개 다운로드 정보를 확인하세요.',
        navLatest: '최신 버전',
        navHome: '공식 사이트로',
        versionNavLabel: '버전 탐색',
        sectionLabel: '버전 기록',
        statCount: (n) => `${n}개 버전`,
        statNote: '꾸준히 유지보수 중',
        currentRelease: '현재 공개 버전',
        allVersions: '전체 버전',
        sortedByDate: '릴리스 날짜순',
        groups: { features: '새 기능', improvements: '개선 사항', fixes: '버그 수정' },
        emptyGroup: '이 버전에는 해당 항목이 없습니다',
        emptyLatest: '아직 릴리스 기록이 없습니다.',
        emptyHistory: '이전 버전이 없습니다.',
        loadError: '릴리스 기록을 불러올 수 없습니다.',
        noDownloads: '공개 다운로드 링크가 아직 없습니다.',
        actionLinks: {
          windowsInstaller: 'Windows x64 설치 파일',
          windowsPortable: 'Windows 포터블',
          cnbRelease: 'CNB 다운로드',
          githubRelease: '예비 다운로드',
          browserExtension: 'Chrome 확장 프로그램',
        },
        historyLinks: {
          windowsInstaller: '설치 파일',
          windowsPortable: '포터블',
          cnbRelease: '다운로드',
          githubRelease: '예비 다운로드',
          browserExtension: '확장 프로그램',
        },
      },
    }

    const groupKeys = ['features', 'improvements', 'fixes']
    // [data key, 固定标签（与语言无关）, 是否主按钮]
    const publicLinks = [
      ['macArm64Dmg', 'macOS Apple Silicon DMG', true],
      ['macX64Dmg', 'macOS Intel DMG', false],
      ['macArm64Zip', 'macOS Apple Silicon ZIP', false],
      ['macX64Zip', 'macOS Intel ZIP', false],
      ['windowsInstaller', null, true],
      ['windowsPortable', null, false],
      ['cnbRelease', null, false],
      ['githubRelease', null, false],
      ['browserExtension', null, false],
    ]
    const historyLinkKeys = [
      ['macArm64Dmg', 'macOS Apple Silicon'],
      ['macX64Dmg', 'macOS Intel'],
      ['windowsInstaller', null],
      ['windowsPortable', null],
      ['cnbRelease', null],
      ['githubRelease', null],
      ['browserExtension', null],
    ]

    let releasesData = []
    let currentLang = detectLang()

    function detectLang() {
      const stored = localStorage.getItem('orcabox-lang')
      if (stored && i18n[stored]) return stored
      const nav = navigator.language || ''
      if (nav.startsWith('zh')) return 'zh'
      if (nav.startsWith('ja')) return 'ja'
      if (nav.startsWith('ko')) return 'ko'
      return 'en'
    }

    const dict = () => i18n[currentLang]
    // 条目正文：中文用数据里的 text，其它语言用 i18n 译文，缺译文时回退 text
    const localizedText = (item) => currentLang === 'zh'
      ? item.text
      : item.i18n?.[currentLang] || item.text
    const localizedSummary = (release) => currentLang === 'zh'
      ? release.summary
      : release.summaryI18n?.[currentLang] || release.summary

    const esc = (value) => String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;')

    const actionLink = (url, label, primary = false) => url
      ? `<a class="action-link${primary ? ' is-primary' : ''}" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`
      : ''

    const textLink = (url, label) => url
      ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`
      : ''

    const renderGroup = (key, categories = {}) => {
      const d = dict()
      const items = (categories[key] || [])
        .map((item) => `<li>${esc(localizedText(item))}</li>`)
        .join('')
      return `<div class="change-group"><h3>${d.groups[key]}</h3><ul>${items || `<li>${d.emptyGroup}</li>`}</ul></div>`
    }

    const renderActions = (links = {}) => {
      const d = dict()
      return publicLinks
        .map(([key, fallbackLabel, primary]) => actionLink(links[key], d.actionLinks[key] || fallbackLabel, primary))
        .filter(Boolean)
        .join('')
    }

    const renderHistoryLinks = (links = {}) => {
      const d = dict()
      return historyLinkKeys
        .map(([key, fallbackLabel]) => textLink(links[key], d.historyLinks[key] || fallbackLabel))
        .filter(Boolean)
        .join('')
    }

    const renderVersionNav = (releases) => {
      versionList.innerHTML = releases.map((release, index) =>
        `<a class="version-item${index === 0 ? ' is-current' : ''}" href="#${esc(release.tag)}">
          <strong>${esc(release.displayVersion || release.version)}</strong>
          <span>${esc(release.date)}</span>
        </a>`,
      ).join('')
    }

    const renderAll = () => {
      const d = dict()
      releaseCount.textContent = d.statCount(releasesData.length || '--')
      document.getElementById('stat-note').textContent = d.statNote

      if (!releasesData.length) {
        latest.innerHTML = ''
        history.innerHTML = ''
        return
      }

      renderVersionNav(releasesData)
      const current = releasesData[0]
      latest.innerHTML = `<article id="${esc(current.tag)}" class="release-panel">
        <div class="release-head">
          <div>
            <h2>${esc(current.title)}</h2>
            <p>${esc(d.currentRelease)}</p>
          </div>
          <time class="release-date" datetime="${esc(current.date)}">${esc(current.date)}</time>
        </div>
        <p class="release-summary">${esc(localizedSummary(current))}</p>
        <div class="change-grid">
          ${groupKeys.map((key) => renderGroup(key, current.categories)).join('')}
        </div>
        <div class="release-actions">${renderActions(current.links) || `<span class="empty">${d.noDownloads}</span>`}</div>
      </article>`

      history.innerHTML = releasesData.map((release) =>
        `<article id="${esc(release.tag)}" class="history-card">
          <div>
            <h3>${esc(release.title)}</h3>
            <time datetime="${esc(release.date)}">${esc(release.date)}</time>
          </div>
          <p>${esc(localizedSummary(release))}</p>
          <div class="history-links">${renderHistoryLinks(release.links)}</div>
        </article>`,
      ).join('')
    }

    function applyLang(lang) {
      currentLang = lang
      localStorage.setItem('orcabox-lang', lang)
      const d = dict()
      document.documentElement.setAttribute('lang', d.htmlLang)
      document.title = d.title
      langLabel.textContent = langLabels[lang]
      document.getElementById('nav-latest').textContent = d.navLatest
      document.getElementById('nav-home').textContent = d.navHome
      document.getElementById('eyebrow').textContent = d.eyebrow
      document.getElementById('hero-title').textContent = d.heroTitle
      document.getElementById('hero-desc').textContent = d.heroDesc
      document.getElementById('section-label').textContent = d.sectionLabel
      document.getElementById('history-title').textContent = d.allVersions
      document.getElementById('history-sort').textContent = d.sortedByDate
      versionNav.setAttribute('aria-label', d.versionNavLabel)
      document.querySelectorAll('.lang-option').forEach((opt) => {
        opt.classList.toggle('active', opt.getAttribute('data-lang') === lang)
      })
      renderAll()
    }

    function setLangDropOpen(open) {
      langDrop.classList.toggle('show', open)
      langBtn.classList.toggle('open', open)
      langBtn.setAttribute('aria-expanded', String(open))
      langDrop.setAttribute('aria-hidden', String(!open))
    }

    langBtn.addEventListener('click', (event) => {
      event.stopPropagation()
      setLangDropOpen(!langDrop.classList.contains('show'))
    })
    langDrop.querySelectorAll('.lang-option').forEach((opt) => {
      opt.addEventListener('click', () => {
        setLangDropOpen(false)
        applyLang(opt.getAttribute('data-lang'))
      })
    })
    document.addEventListener('click', (event) => {
      if (!langSwitch.contains(event.target)) setLangDropOpen(false)
    })
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && langDrop.classList.contains('show')) {
        setLangDropOpen(false)
        langBtn.focus()
      }
    })

    applyLang(currentLang)

    fetch('releases.json?v=1.2.6', { cache: 'no-store' })
      .then((response) => response.json())
      .then((data) => {
        releasesData = Array.isArray(data.releases) ? data.releases : []
        renderAll()
        if (!releasesData.length) {
          latest.innerHTML = `<div class="empty">${dict().emptyLatest}</div>`
          history.innerHTML = `<div class="empty">${dict().emptyHistory}</div>`
        }
      })
      .catch(() => {
        latest.innerHTML = `<div class="empty">${dict().loadError}</div>`
      })
  </script>
</body>
</html>
