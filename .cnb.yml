$:
  vscode:
    - docker:
        build: .ide/Dockerfile
      services:
        - docker
        - name: vscode
          options:
            onlyPreview: true
            launch: node server.mjs
            keepAliveTimeout: 30m
            daemon: true
            backup: false
      stages:
        - node --check server.mjs

main:
  push:
    - stages:
        - name: Fetch and verify Windows 1.2.4 assets
          image: cnbcool/default-build-env:latest
          script:
            - set -eu
            - mkdir -p release-assets
            - curl -fL --retry 3 --retry-delay 2 "https://github.com/GarryGit888/OrcaBox-Release/releases/download/v1.2.4/OrcaBox.Setup.1.2.4.exe" -o release-assets/OrcaBox.Setup.1.2.4.exe
            - curl -fL --retry 3 --retry-delay 2 "https://github.com/GarryGit888/OrcaBox-Release/releases/download/v1.2.4/OrcaBox.Setup.1.2.4.exe.blockmap" -o release-assets/OrcaBox.Setup.1.2.4.exe.blockmap
            - curl -fL --retry 3 --retry-delay 2 "https://github.com/GarryGit888/OrcaBox-Release/releases/download/v1.2.4/OrcaBox-1.2.4-Windows-x64-Portable.exe" -o release-assets/OrcaBox-1.2.4-Windows-x64-Portable.exe
            - curl -fL --retry 3 --retry-delay 2 "https://github.com/GarryGit888/OrcaBox-Release/releases/download/v1.2.4/latest.yml" -o release-assets/latest.yml
            - printf '%s  %s\n' 'b9f050e0dcaba4157e3c1526e88d83065257605f7193d70d79a2bddb09f877a5' release-assets/OrcaBox.Setup.1.2.4.exe | shasum -a 256 -c -
            - printf '%s  %s\n' '784a03c450b6678cfbc36c738069d62967650fce1c0ac817ef11c7456d0a163e' release-assets/OrcaBox.Setup.1.2.4.exe.blockmap | shasum -a 256 -c -
            - printf '%s  %s\n' '5318e2e4bf91c86b2e7c9f4005564c87ee6dd911845d4888abdf0a24e721b118' release-assets/OrcaBox-1.2.4-Windows-x64-Portable.exe | shasum -a 256 -c -
            - test "$(sed -n '1p' release-assets/latest.yml)" = 'version: 1.2.4'
            - test "$(sed -n '3p' release-assets/latest.yml | sed 's/^[[:space:]]*- url: //')" = 'OrcaBox.Setup.1.2.4.exe'
        - name: Refresh CNB v1.2.4 release notes
          type: git:release
          options:
            overlying: true
            tag: v1.2.4
            title: OrcaBox 1.2.4
            descriptionFromFile: OrcaBox-1.2.4-Release-Notes.md
            latest: true
        - name: Attach Windows 1.2.4 assets to CNB release
          image: cnbcool/attachments:latest
          settings:
            tag: v1.2.4
            attachments:
              - release-assets/OrcaBox.Setup.1.2.4.exe
              - release-assets/OrcaBox.Setup.1.2.4.exe.blockmap
              - release-assets/OrcaBox-1.2.4-Windows-x64-Portable.exe
              - release-assets/latest.yml

"v*":
  tag_push:
    - stages:
        - name: Download GitHub release assets
          script: |
            set -eu
            version="${CNB_BRANCH#v}"
            mkdir -p release-assets
            for asset in \
              "OrcaBox-${version}-arm64.dmg" \
              "OrcaBox-${version}-arm64.dmg.blockmap" \
              "OrcaBox-${version}-arm64-mac.zip" \
              "OrcaBox-${version}-arm64-mac.zip.blockmap" \
              "OrcaBox-${version}.dmg" \
              "OrcaBox-${version}.dmg.blockmap" \
              "OrcaBox-${version}-mac.zip" \
              "OrcaBox-${version}-mac.zip.blockmap" \
              "OrcaBox-Chrome-Extension-${version}.zip" \
              "latest-mac.yml"; do
              curl --fail --location --retry 3 --output "release-assets/${asset}" "https://github.com/GarryGit888/OrcaBox-Release/releases/download/${CNB_BRANCH}/${asset}"
            done
            cp "OrcaBox-${version}-Release-Notes.md" release-assets/RELEASE_NOTES.md
        - name: Create CNB release
          type: git:release
          options:
            descriptionFromFile: release-assets/RELEASE_NOTES.md
            preRelease: true
            latest: true
        - name: Upload release assets
          image: cnbcool/attachments
          settings:
            attachments:
              - release-assets/*
